services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xeno
      POSTGRES_PASSWORD: xeno
      POSTGRES_DB: xeno_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xeno -d xeno_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://xeno:xeno@postgres:5432/xeno_crm
      REDIS_URL: redis://redis:6379/0
      CHANNEL_SERVICE_URL: http://channel-service:8001
      CRM_CALLBACK_URL: http://backend:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  channel-service:
    build: ./channel-service
    ports:
      - "8001:8001"
    environment:
      CRM_CALLBACK_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./channel-service:/app

volumes:
  postgres_data:
